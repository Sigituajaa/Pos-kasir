<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS KASIR - OKTSHOP17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #eff6ff; }
        .product-card { transition: all 0.2s ease; border: 1px solid #dbeafe; }
        .product-card:active { transform: scale(0.95); }
        .blue-gradient { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- HEADER -->
    <header class="bg-white border-b sticky top-0 z-50 px-4 py-4 shadow-sm">
        <div class="flex items-center justify-between max-w-6xl mx-auto">
            <button onclick="showPage('admin')" class="text-blue-600 font-semibold flex items-center gap-2 hover:bg-blue-50 p-2 rounded-xl transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span class="hidden md:inline text-sm">Admin Panel</span>
            </button>
            <div class="text-center">
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">OKTSHOP17</h1>
                <p class="text-[10px] font-bold text-blue-600 tracking-[0.2em] uppercase">Digital Point of Sale</p>
            </div>
            <div class="w-20 md:w-24 flex justify-end">
                <button onclick="location.reload()" class="p-2 hover:bg-slate-100 rounded-xl">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (KATALOG) -->
    <main id="page-home" class="max-w-6xl mx-auto p-4">
        <div class="blue-gradient mb-8 p-8 rounded-[2.5rem] text-white shadow-xl shadow-blue-200">
            <h2 class="text-2xl font-extrabold mb-1">Menu Utama</h2>
            <p class="text-blue-100 text-sm font-medium opacity-90">Klik produk untuk memproses pesanan</p>
        </div>
        <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- ADMIN PANEL PAGE -->
    <main id="page-admin" class="max-w-6xl mx-auto p-4 hidden">
        <button onclick="showPage('home')" class="mb-6 text-blue-600 flex items-center gap-2 hover:underline font-bold">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Kasir
        </button>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Manage Products -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <i data-lucide="edit" class="text-blue-600 w-5 h-5"></i> Kelola Produk
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Pilih Produk</label>
                        <select id="edit-select" onchange="loadProductData()" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 font-semibold"></select>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Nama Baru</label>
                        <input id="edit-name" type="text" class="w-full p-3 border border-slate-200 rounded-xl outline-none">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Harga Baru (Rp)</label>
                        <input id="edit-price" type="number" class="w-full p-3 border border-slate-200 rounded-xl outline-none font-mono">
                    </div>
                    <button onclick="updateProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 transition">
                        Simpan Perubahan
                    </button>
                </div>
            </div>

            <!-- Transaction Report -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <i data-lucide="pie-chart" class="text-emerald-600 w-5 h-5"></i> Laporan Transaksi
                </h2>
                <div class="space-y-3">
                    <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100 flex justify-between items-center">
                        <span class="text-xs font-bold text-blue-700 uppercase">Total Transaksi</span>
                        <span id="today-count" class="text-2xl font-black text-blue-800">0</span>
                    </div>
                    <button onclick="downloadPDF()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-black transition">
                        <i data-lucide="file-text" class="w-5 h-5"></i> Cetak Semua Transaksi
                    </button>
                </div>
            </div>

            <!-- Item Sales Report -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <i data-lucide="bar-chart-3" class="text-orange-600 w-5 h-5"></i> Penjualan Per Item
                </h2>
                <div id="item-sales-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto"></div>
                <button onclick="downloadItemReportPDF()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-orange-700 transition">
                    <i data-lucide="download" class="w-5 h-5"></i> Download Laporan Item
                </button>
            </div>
        </div>
    </main>

    <!-- BOTTOM BAR -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-4 pb-6 shadow-[0_-10px_25px_rgba(0,0,0,0.05)] z-40">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="relative bg-blue-600 p-3.5 rounded-2xl shadow-lg shadow-blue-200">
                    <i data-lucide="shopping-cart" class="w-6 h-6 text-white"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-slate-900 text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-4 border-white">0</span>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Pembayaran</p>
                    <p id="total-price" class="text-xl font-black text-slate-900">Rp 0</p>
                </div>
            </div>
            <button onclick="openCheckout()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-2xl font-bold shadow-xl shadow-blue-200 text-center text-lg">
                BAYAR
            </button>
        </div>
    </div>

    <!-- MODAL PEMBAYARAN -->
    <div id="modal-checkout" class="fixed inset-0 bg-slate-900/60 z-[60] flex items-end md:items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] md:rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="font-bold text-xl text-slate-800">Detail Pesanan</h3>
                <button onclick="closeCheckout()" class="p-2 hover:bg-slate-100 rounded-full text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <div id="cart-items" class="max-h-[35vh] overflow-y-auto p-6 space-y-3"></div>
            <div class="p-8 bg-slate-50 space-y-6">
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setPayment('Cash')" class="pay-btn border-2 border-slate-200 bg-white py-4 rounded-2xl text-[11px] font-bold text-center transition" id="btn-cash">CASH</button>
                    <button onclick="setPayment('QRIS')" class="pay-btn border-2 border-slate-200 bg-white py-4 rounded-2xl text-[11px] font-bold text-center transition" id="btn-qr">QRIS</button>
                    <button onclick="setPayment('Shopee')" class="pay-btn border-2 border-slate-200 bg-white py-4 rounded-2xl text-[11px] font-bold text-center transition" id="btn-sf">SHOPEE</button>
                </div>
                <button onclick="processOrder()" id="confirm-pay" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-[1.5rem] font-bold disabled:bg-slate-300 transition" disabled>
                    KONFIRMASI SELESAI
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL SUKSES -->
    <div id="modal-success" class="fixed inset-0 bg-slate-900/80 z-[70] flex items-center justify-center hidden p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle-2" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Berhasil!</h2>
            <p class="text-slate-500 text-sm mb-8">Transaksi telah dicatat.</p>
            <div class="space-y-3">
                <button onclick="printReceipt()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-black transition">
                    <i data-lucide="printer" class="w-5 h-5"></i> Cetak Struk (PDF)
                </button>
                <button onclick="sendWhatsApp()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-emerald-600 transition">
                    <i data-lucide="message-circle" class="w-5 h-5"></i> Kirim WhatsApp
                </button>
                <button onclick="finishTransaction()" class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold hover:bg-slate-200 transition mt-4">
                    Selesai & Reset
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORE_NAME = "OKTSHOP17";
        const STORE_ADDR = "Jl. Sokhari No.26, RT.1/RW.2, Cipare, Kec. Serang, Kota Serang, Banten 42117";
        const STORE_PHONE = "0895-3454-52412";

        // CATALOG UPDATED TO 14 ITEMS
        let products = JSON.parse(localStorage.getItem('pos_products')) || [
            { id: 1, name: 'Boci Urat', price: 12000 },
            { id: 2, name: 'Boci Ayam', price: 10000 },
            { id: 3, name: 'Boci Tetelan', price: 10000 },
            { id: 4, name: 'Cireng Kuah Keju 4Pcs', price: 10000 },
            { id: 5, name: 'Cireng 1Pcs', price: 2000 },
            { id: 6, name: 'Otak-otak Bojot 3Pcs', price: 5000 },
            { id: 7, name: 'Basreng Bojot (3Pcs)', price: 5000 },
            { id: 8, name: 'Basreng/Otak-otak 1Pcs', price: 1000 },
            { id: 9, name: 'Sosis/Dumpling 1Pcs', price: 2000 },
            { id: 10, name: 'Dimsum 1Pcs', price: 3000 },
            { id: 11, name: 'Dimsum Chili oil 3Pcs', price: 10000 },
            { id: 12, name: 'Es Pop Ice', price: 3000 },
            { id: 13, name: 'Es Jasjus/Teajus', price: 2000 }, // NEW
            { id: 14, name: 'Es Kopi Gooday', price: 5000 },       // NEW
        ];

        let cart = [];
        let selectedPayment = '';
        let lastOrder = null;
        let orderHistory = JSON.parse(localStorage.getItem('pos_history')) || [];
        let nextReceiptNum = parseInt(localStorage.getItem('pos_receipt_counter')) || 1;

        function init() {
            renderCatalog();
            updateCartUI();
            lucide.createIcons();
        }

        function showPage(page) {
            document.getElementById('page-home').classList.toggle('hidden', page !== 'home');
            document.getElementById('bottom-bar').classList.toggle('hidden', page !== 'home');
            document.getElementById('page-admin').classList.toggle('hidden', page !== 'admin');
            if(page === 'admin') renderAdminTools();
            lucide.createIcons();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="addToCart(${p.id})" class="product-card bg-white p-5 rounded-[2rem] shadow-sm hover:border-blue-400 cursor-pointer">
                    <h3 class="font-extrabold text-slate-800 text-sm mb-2">${p.name}</h3>
                    <p class="text-blue-600 font-black">Rp ${p.price.toLocaleString()}</p>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
            renderCartItems();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString()}`;
        }

        function openCheckout() {
            if (cart.length === 0) return alert('Pilih produk dulu!');
            document.getElementById('modal-checkout').classList.remove('hidden');
            renderCartItems();
        }

        function closeCheckout() {
            document.getElementById('modal-checkout').classList.add('hidden');
            selectedPayment = '';
            updatePaymentButtons();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 text-sm">
                    <div>
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-blue-600 font-bold">Rp ${(item.price * item.qty).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-1 rounded-xl font-bold">
                        <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 text-slate-400 hover:text-red-500">-</button>
                        <span>${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 text-slate-400 hover:text-blue-600">+</button>
                    </div>
                </div>
            `).join('');
        }

        function setPayment(method) {
            selectedPayment = method;
            updatePaymentButtons();
            document.getElementById('confirm-pay').disabled = false;
        }

        function updatePaymentButtons() {
            const btns = { 'Cash': 'btn-cash', 'QRIS': 'btn-qr', 'Shopee': 'btn-sf' };
            Object.values(btns).forEach(id => {
                document.getElementById(id).className = "pay-btn border-2 border-slate-200 bg-white py-4 rounded-2xl text-[11px] font-bold text-center transition";
            });
            if(btns[selectedPayment]) {
                document.getElementById(btns[selectedPayment]).className = "pay-btn border-2 border-blue-600 bg-blue-50 py-4 rounded-2xl text-[11px] font-bold text-center text-blue-700 transition font-black";
            }
        }

        function processOrder() {
            const receiptID = nextReceiptNum.toString().padStart(5, '0');
            lastOrder = {
                id: receiptID,
                date: new Date().toLocaleString('id-ID'),
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                method: selectedPayment,
                items: JSON.parse(JSON.stringify(cart))
            };
            orderHistory.push(lastOrder);
            localStorage.setItem('pos_history', JSON.stringify(orderHistory));
            nextReceiptNum++;
            localStorage.setItem('pos_receipt_counter', nextReceiptNum);
            document.getElementById('modal-checkout').classList.add('hidden');
            document.getElementById('modal-success').classList.remove('hidden');
        }

        function finishTransaction() {
            cart = [];
            lastOrder = null;
            updateCartUI();
            document.getElementById('modal-success').classList.add('hidden');
        }

        function printReceipt() {
            if(!lastOrder) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: [80, 160] });
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(STORE_NAME, 40, 10, { align: "center" });
            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");
            doc.text("Digital Point of Sale", 40, 14, { align: "center" });
            doc.text("-".repeat(45), 40, 18, { align: "center" });
            doc.text(`Tgl : ${lastOrder.date}`, 5, 22);
            doc.text(`No. Struk : ${lastOrder.id}`, 5, 26);
            doc.text(`Metode : ${lastOrder.method}`, 5, 30);
            doc.text("-".repeat(45), 40, 34, { align: "center" });
            let y = 38;
            lastOrder.items.forEach(item => {
                doc.setFont("helvetica", "bold");
                doc.text(`${item.name}`, 5, y);
                doc.setFont("helvetica", "normal");
                const subtotal = (item.price * item.qty).toLocaleString();
                doc.text(`${item.qty} x ${item.price.toLocaleString()}`, 5, y + 4);
                doc.text(`Rp ${subtotal}`, 75, y + 4, { align: "right" });
                y += 10;
            });
            doc.text("-".repeat(45), 40, y, { align: "center" });
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text("TOTAL BAYAR", 5, y + 6);
            doc.text(`Rp ${lastOrder.total.toLocaleString()}`, 75, y + 6, { align: "right" });
            y += 16;
            doc.setFontSize(7);
            doc.setFont("helvetica", "normal");
            const splitAddr = doc.splitTextToSize(STORE_ADDR, 70);
            doc.text(splitAddr, 40, y, { align: "center" });
            y += (splitAddr.length * 3.5);
            doc.text(`Telp: ${STORE_PHONE}`, 40, y, { align: "center" });
            y += 5;
            doc.setFont("helvetica", "italic");
            doc.text("Terima kasih atas kunjungannya!", 40, y, { align: "center" });
            doc.save(`Struk_${lastOrder.id}.pdf`);
        }

        function getItemSalesData() {
            const summary = {};
            orderHistory.forEach(order => {
                order.items.forEach(item => {
                    if (!summary[item.name]) summary[item.name] = { qty: 0, revenue: 0 };
                    summary[item.name].qty += item.qty;
                    summary[item.name].revenue += (item.qty * item.price);
                });
            });
            return Object.keys(summary).map(name => ({
                name, qty: summary[name].qty, revenue: summary[name].revenue
            })).sort((a, b) => b.qty - a.qty);
        }

        function downloadItemReportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = getItemSalesData();
            doc.setFontSize(16);
            doc.text(`LAPORAN PENJUALAN PER ITEM - ${STORE_NAME}`, 14, 20);
            const tableRows = data.map(item => [item.name, item.qty, `Rp ${item.revenue.toLocaleString()}`]);
            doc.autoTable({
                head: [['Nama Produk', 'Jumlah Terjual', 'Total Pendapatan']],
                body: tableRows, startY: 35, theme: 'grid', headStyles: { fillStyle: [30, 64, 175] }
            });
            doc.save("Laporan_Per_Item.pdf");
        }

        function renderAdminTools() {
            const select = document.getElementById('edit-select');
            select.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            loadProductData();
            document.getElementById('today-count').innerText = orderHistory.length;
            const itemSalesList = document.getElementById('item-sales-list');
            const itemData = getItemSalesData();
            itemSalesList.innerHTML = itemData.map(i => `
                <div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                    <span class="font-bold text-slate-700">${i.name}</span>
                    <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-md font-black">${i.qty} x</span>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Belum ada data</p>';
        }

        function loadProductData() {
            const id = parseInt(document.getElementById('edit-select').value);
            const product = products.find(p => p.id === id);
            if(product) {
                document.getElementById('edit-name').value = product.name;
                document.getElementById('edit-price').value = product.price;
            }
        }

        function updateProduct() {
            const id = parseInt(document.getElementById('edit-select').value);
            const index = products.findIndex(p => p.id === id);
            if (index !== -1) {
                products[index].name = document.getElementById('edit-name').value;
                products[index].price = parseInt(document.getElementById('edit-price').value);
                localStorage.setItem('pos_products', JSON.stringify(products));
                alert('Produk berhasil diperbarui!');
                renderCatalog();
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(`LAPORAN SEMUA TRANSAKSI - ${STORE_NAME}`, 14, 20);
            const data = orderHistory.map(o => [o.id, o.date, o.method, `Rp ${o.total.toLocaleString()}`]);
            doc.autoTable({ head: [['No. Struk', 'Waktu', 'Metode', 'Total']], body: data, startY: 30 });
            doc.save("Laporan_Transaksi.pdf");
        }

        function sendWhatsApp() {
            if(!lastOrder) return;
            let text = `*STRUK PEMBAYARAN ${STORE_NAME}*%0A`;
            text += `------------------------------------------%0A`;
            text += `No: ${lastOrder.id}%0A`;
            text += `Tgl: ${lastOrder.date}%0A`;
            text += `------------------------------------------%0A`;
            lastOrder.items.forEach(item => {
                text += `*${item.name}*%0A`;
                text += `${item.qty} x Rp ${item.price.toLocaleString()} = Rp ${(item.qty * item.price).toLocaleString()}%0A`;
            });
            text += `------------------------------------------%0A`;
            text += `*TOTAL: Rp ${lastOrder.total.toLocaleString()}*%0A`;
            text += `------------------------------------------%0A`;
            text += `Terima kasih atas kunjungannya!`;
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        init();
    </script>
</body>
</html>
