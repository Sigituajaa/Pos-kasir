<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASIR OKTSHOP17</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #ffffff;
            --text: #000000;
            --bg: #f4f4f4;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }
        
        /* Header */
        header { background: var(--primary); color: white; padding: 15px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .profile-btn { position: absolute; left: 15px; cursor: pointer; background: none; border: none; color: white; font-size: 26px; }
        header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; font-weight: bold; }

        /* Sidebar Admin */
        .sidebar { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; background: white; z-index: 2000; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.2); padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
        .overlay.active { display: block; }

        /* Form Styling */
        .form-group { background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; }
        input, select, button.action-btn { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        h4 { margin: 10px 0; border-left: 4px solid var(--primary); padding-left: 10px; font-size: 1rem; }

        /* Admin Daftar Katalog Item */
        .admin-item-row { display: flex; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; }
        .admin-item-row img { width: 45px; height: 45px; border-radius: 5px; object-fit: cover; margin-right: 10px; }
        .admin-item-info { flex: 1; font-size: 0.8rem; }
        .btn-edit-plus { background: var(--primary); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; margin-right: 5px; font-weight: bold; }
        .btn-del-trash { background: var(--danger); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; }

        /* Katalog Beranda */
        .container { padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        @media (max-width: 600px) { .container { grid-template-columns: repeat(2, 1fr); } }
        
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid #eee; }
        .card img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
        .card-info { padding: 8px; flex-grow: 1; text-align: center; }
        .card-info h3 { margin: 0; font-size: 0.85rem; height: 2.5em; overflow: hidden; }
        .card-info p { margin: 5px 0; color: var(--primary); font-weight: bold; font-size: 0.9rem; }
        .btn-add-cart { background: var(--primary); color: white; border: none; padding: 10px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        /* Footer */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-sizing: border-box; }
        .btn-pay { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; }
        .modal-content { background: white; margin: 10% auto; width: 90%; max-width: 450px; border-radius: 15px; padding: 20px; box-sizing: border-box; }
        .checkout-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <button class="profile-btn" onclick="toggleSidebar()">👤</button>
        <h1>KASIR OKTSHOP17</h1>
    </header>

    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR ADMIN PANEL -->
    <div id="sidebar-admin" class="sidebar">
        <button style="float:right; border:none; background:none; font-size:28px;" onclick="toggleSidebar()">&times;</button>
        <h2 style="color: var(--primary); margin:0;">Admin Panel</h2>
        <hr>

        <div class="form-group" id="form-container">
            <h4 id="form-title">Tambah Menu Baru</h4>
            <input type="hidden" id="edit-index" value="-1">
            <input type="text" id="inp-nama" placeholder="Nama Menu">
            <input type="number" id="inp-harga" placeholder="Harga (Rp)">
            <input type="number" id="inp-stok" placeholder="Jumlah Stok">
            <input type="file" id="inp-foto" accept="image/*">
            <button class="action-btn" id="btn-save" onclick="handleSimpanMenu()" style="background: var(--primary); color: white;">SIMPAN KE KATALOG</button>
            <button id="btn-cancel" onclick="resetForm()" style="display:none; background:#ccc; border:none; padding:10px; width:100%; border-radius:8px;">Batal Edit</button>
        </div>

        <h4>Daftar Katalog (Max 20)</h4>
        <div id="admin-katalog-list" style="margin-bottom: 20px;">
            <!-- List Menu Admin -->
        </div>

        <hr>
        <h4>Pengaturan Lain</h4>
        <label style="font-size: 12px;">Update Foto QRIS:</label>
        <input type="file" onchange="updateQrisImage(this)">
        <button class="action-btn" onclick="downloadReport()" style="background: #e67e22; color: white;">📄 CETAK LAPORAN 30 HARI</button>
        <button onclick="clearHistory()" style="background:none; border:none; color:red; font-size:11px; cursor:pointer; width:100%;">Hapus Semua Riwayat Transaksi</button>
    </div>

    <!-- BERANDA KATALOG -->
    <div class="container" id="main-katalog"></div>

    <!-- FOOTER -->
    <div class="bottom-nav">
        <div>
            <small id="cart-qty">0 Item</small><br>
            <strong id="cart-total">Rp 0</strong>
        </div>
        <button class="btn-pay" onclick="openCheckoutModal()">BAYAR</button>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="modal-checkout" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">Checkout</h3>
            <div id="checkout-list" style="max-height: 200px; overflow-y: auto;"></div>
            <div style="display:flex; justify-content:space-between; margin-top:15px; font-weight:bold;">
                <span>Total:</span>
                <span id="total-val" style="color:var(--primary)">Rp 0</span>
            </div>
            <hr>
            <label>Metode Pembayaran:</label>
            <select id="pay-method" onchange="checkQrisView()">
                <option value="Cash">Cash (Tunai)</option>
                <option value="Qris">QRIS</option>
                <option value="ShopeeFood">ShopeeFood</option>
            </select>
            <div id="qris-box" style="display:none; text-align:center; margin-top:10px;">
                <img id="qris-img-preview" src="" style="width:100%; border:1px solid #ddd; border-radius:10px;">
            </div>
            <button class="action-btn" onclick="finishTransaction()" style="background: var(--primary); color: white; margin-top:15px;">SELESAI</button>
            <button class="action-btn" onclick="closeCheckoutModal()" style="background: #eee;">Batal</button>
        </div>
    </div>

    <script>
        // DATA STORAGE
        let catalog = JSON.parse(localStorage.getItem('okt_catalog')) || [];
        let cart = [];
        let history = JSON.parse(localStorage.getItem('okt_history')) || [];
        let qrisData = localStorage.getItem('okt_qris_img') || '';

        function init() {
            renderMain();
            renderAdmin();
            document.getElementById('qris-img-preview').src = qrisData;
        }

        function toggleSidebar() {
            document.getElementById('sidebar-admin').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // --- FUNGSI ADMIN & KATALOG ---
        function handleSimpanMenu() {
            const index = parseInt(document.getElementById('edit-index').value);
            const nama = document.getElementById('inp-nama').value;
            const harga = document.getElementById('inp-harga').value;
            const stok = document.getElementById('inp-stok').value;
            const fotoInput = document.getElementById('inp-foto');

            if (!nama || !harga) return alert("Nama dan Harga harus diisi!");

            const saveAction = (imageData = '') => {
                const menuData = {
                    nama: nama,
                    harga: parseInt(harga),
                    stok: parseInt(stok) || 0,
                    foto: imageData || (index >= 0 ? catalog[index].foto : '')
                };

                if (index >= 0) {
                    catalog[index] = menuData;
                    alert("Berhasil diperbarui!");
                } else {
                    if (catalog.length >= 20) return alert("Maksimal 20 menu!");
                    catalog.push(menuData);
                    alert("Berhasil disimpan!");
                }

                localStorage.setItem('okt_catalog', JSON.stringify(catalog));
                resetForm();
                renderMain();
                renderAdmin();
            };

            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => saveAction(e.target.result);
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                saveAction();
            }
        }

        function editMenu(index) {
            const item = catalog[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('inp-nama').value = item.nama;
            document.getElementById('inp-harga').value = item.harga;
            document.getElementById('inp-stok').value = item.stok;
            
            document.getElementById('form-title').innerText = "Edit Menu: " + item.nama;
            document.getElementById('btn-save').innerText = "UPDATE MENU";
            document.getElementById('btn-save').style.background = "var(--warning)";
            document.getElementById('btn-cancel').style.display = "block";
            
            // Scroll otomatis ke atas form agar terlihat
            document.getElementById('form-container').scrollIntoView();
        }

        function deleteMenu(index) {
            if (confirm("Hapus menu " + catalog[index].nama + "?")) {
                catalog.splice(index, 1);
                localStorage.setItem('okt_catalog', JSON.stringify(catalog));
                renderMain();
                renderAdmin();
            }
        }

        function resetForm() {
            document.getElementById('edit-index').value = "-1";
            document.getElementById('inp-nama').value = "";
            document.getElementById('inp-harga').value = "";
            document.getElementById('inp-stok').value = "";
            document.getElementById('inp-foto').value = "";
            document.getElementById('form-title').innerText = "Tambah Menu Baru";
            document.getElementById('btn-save').innerText = "SIMPAN KE KATALOG";
            document.getElementById('btn-save').style.background = "var(--primary)";
            document.getElementById('btn-cancel').style.display = "none";
        }

        // --- RENDERING ---
        function renderMain() {
            const container = document.getElementById('main-katalog');
            container.innerHTML = catalog.length ? '' : '<p style="grid-column:1/4;text-align:center;padding-top:50px;color:#888;">Katalog masih kosong.</p>';
            catalog.forEach((item, index) => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${item.foto || 'https://via.placeholder.com/150?text=No+Image'}" alt="img">
                        <div class="card-info">
                            <h3>${item.nama}</h3>
                            <p>Rp ${item.harga.toLocaleString()}</p>
                            <small>Stok: ${item.stok}</small>
                        </div>
                        <button class="btn-add-cart" onclick="addToCart(${index})">+ Keranjang</button>
                    </div>
                `;
            });
        }

        function renderAdmin() {
            const list = document.getElementById('admin-katalog-list');
            list.innerHTML = catalog.length ? '' : '<p style="text-align:center;font-size:12px;color:#888;">Menu kosong.</p>';
            catalog.forEach((item, index) => {
                list.innerHTML += `
                    <div class="admin-item-row">
                        <img src="${item.foto || 'https://via.placeholder.com/150?text=X'}" alt="X">
                        <div class="admin-item-info">
                            <strong>${item.nama}</strong><br>
                            <span>Rp ${item.harga.toLocaleString()}</span>
                        </div>
                        <button class="btn-edit-plus" onclick="editMenu(${index})" title="Edit Menu">+</button>
                        <button class="btn-del-trash" onclick="deleteMenu(${index})">🗑</button>
                    </div>
                `;
            });
        }

        // --- TRANSAKSI & KERANJANG ---
        function addToCart(idx) {
            const product = catalog[idx];
            const exists = cart.find(i => i.nama === product.nama);
            if (exists) exists.qty++;
            else cart.push({ nama: product.nama, harga: product.harga, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const totalHarga = cart.reduce((a, b) => a + (b.harga * b.qty), 0);
            document.getElementById('cart-qty').innerText = totalQty + " Item";
            document.getElementById('cart-total').innerText = "Rp " + totalHarga.toLocaleString();
        }

        function openCheckoutModal() {
            if (!cart.length) return alert("Keranjang kosong!");
            const list = document.getElementById('checkout-list');
            list.innerHTML = '';
            cart.forEach((item, index) => {
                list.innerHTML += `
                    <div class="checkout-row">
                        <div style="flex:1"><strong>${item.nama}</strong><br><small>Rp ${item.harga.toLocaleString()} x ${item.qty}</small></div>
                        <div>
                            <button onclick="changeQty('${item.nama}', -1)" style="padding:2px 8px">-</button>
                            <button onclick="changeQty('${item.nama}', 1)" style="padding:2px 8px">+</button>
                        </div>
                    </div>
                `;
            });
            const total = cart.reduce((a, b) => a + (b.harga * b.qty), 0);
            document.getElementById('total-val').innerText = "Rp " + total.toLocaleString();
            document.getElementById('modal-checkout').style.display = 'block';
        }

        function changeQty(nama, delta) {
            const item = cart.find(i => i.nama === nama);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.nama !== nama);
            }
            if (cart.length === 0) closeCheckoutModal();
            else openCheckoutModal();
            updateCartUI();
        }

        function closeCheckoutModal() { document.getElementById('modal-checkout').style.display = 'none'; }

        function finishTransaction() {
            const method = document.getElementById('pay-method').value;
            const total = cart.reduce((a, b) => a + (b.harga * b.qty), 0);
            history.push({
                tgl: new Date().toLocaleString('id-ID'),
                timestamp: new Date().getTime(),
                items: cart.map(i => `${i.nama}(${i.qty})`).join(", "),
                total: total,
                metode: method
            });
            localStorage.setItem('okt_history', JSON.stringify(history));
            alert("Transaksi Berhasil!");
            cart = [];
            updateCartUI();
            closeCheckoutModal();
        }

        // --- TOOLS ---
        function updateQrisImage(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                qrisData = e.target.result;
                localStorage.setItem('okt_qris_img', qrisData);
                document.getElementById('qris-img-preview').src = qrisData;
                alert("QRIS Berhasil Diupdate!");
            };
            reader.readAsDataURL(input.files[0]);
        }

        function checkQrisView() {
            document.getElementById('qris-box').style.display = (document.getElementById('pay-method').value === 'Qris') ? 'block' : 'none';
        }

        function downloadReport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const monthlyData = history.filter(h => h.timestamp >= (new Date().getTime() - 30 * 24 * 60 * 60 * 1000));
            if (!monthlyData.length) return alert("Data riwayat 30 hari kosong.");
            doc.text("LAPORAN PENJUALAN OKTSHOP17", 105, 15, { align: 'center' });
            const rows = monthlyData.map((h, i) => [i + 1, h.tgl, h.items, h.metode, "Rp " + h.total.toLocaleString()]);
            doc.autoTable({ startY: 25, head: [['No', 'Tgl', 'Menu', 'Metode', 'Total']], body: rows });
            doc.save("Laporan_Kasir_30Hari.pdf");
        }

        function clearHistory() { if(confirm("Hapus semua riwayat?")) { history = []; localStorage.setItem('okt_history', JSON.stringify(history)); } }

        init();
    </script>
</body>
</html>
