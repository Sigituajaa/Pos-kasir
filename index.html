<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS KASIR - OKTSHOP17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #eff6ff; }
        .product-card { transition: all 0.2s ease; border: 1px solid #dbeafe; }
        .product-card:active { transform: scale(0.95); }
        .blue-gradient { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .category-tab.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- HEADER -->
    <header class="bg-white border-b sticky top-0 z-50 px-4 py-4 shadow-sm">
        <div class="flex items-center justify-between max-w-6xl mx-auto">
            <button onclick="openLoginModal()" class="text-blue-600 font-semibold flex items-center gap-2 hover:bg-blue-50 p-2 rounded-xl transition">
                <i data-lucide="lock" class="w-5 h-5"></i>
                <span class="hidden md:inline text-sm">Admin Panel</span>
            </button>
            <div class="text-center">
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">OKTSHOP17</h1>
                <p class="text-[10px] font-bold text-blue-600 tracking-[0.2em] uppercase">Digital Point of Sale</p>
            </div>
            <div class="w-20 md:w-24 flex justify-end">
                <button onclick="location.reload()" class="p-2 hover:bg-slate-100 rounded-xl">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MODAL LOGIN ADMIN -->
    <div id="modal-login" class="fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">Login Admin</h3>
                <p class="text-slate-500 text-sm">Masukkan kredensial akses</p>
            </div>
            <div class="space-y-4">
                <input id="login-user" type="text" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="ID User">
                <input id="login-pass" type="password" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password">
                <div class="flex gap-3 pt-2">
                    <button onclick="closeLoginModal()" class="flex-1 bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold">Batal</button>
                    <button onclick="checkLogin()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200">Masuk</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="page-home" class="max-w-6xl mx-auto p-4">
        <div class="blue-gradient mb-6 p-8 rounded-[2.5rem] text-white shadow-xl shadow-blue-200">
            <h2 class="text-2xl font-extrabold mb-1">Menu Utama</h2>
            <p class="text-blue-100 text-sm font-medium opacity-90">Pilih kategori produk</p>
        </div>

        <!-- TAB KATEGORI -->
        <div class="flex gap-2 mb-8 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCategory('Makanan')" id="tab-Makanan" class="category-tab bg-white px-8 py-3 rounded-2xl font-bold text-slate-500 shadow-sm border border-slate-100 whitespace-nowrap active">Makanan</button>
            <button onclick="filterCategory('Minuman')" id="tab-Minuman" class="category-tab bg-white px-8 py-3 rounded-2xl font-bold text-slate-500 shadow-sm border border-slate-100 whitespace-nowrap">Minuman</button>
            <button onclick="filterCategory('Keripik')" id="tab-Keripik" class="category-tab bg-white px-8 py-3 rounded-2xl font-bold text-slate-500 shadow-sm border border-slate-100 whitespace-nowrap">Keripik</button>
        </div>

        <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- ADMIN PANEL -->
    <main id="page-admin" class="max-w-7xl mx-auto p-4 hidden">
        <div class="flex justify-between items-center mb-6">
            <button onclick="showPage('home')" class="text-blue-600 flex items-center gap-2 font-bold">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Kasir
            </button>
            <span class="bg-slate-100 text-slate-500 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-widest">Administrator</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- FORM TAMBAH & EDIT -->
            <div class="space-y-6">
                <!-- TAMBAH PRODUK -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-slate-800">
                        <i data-lucide="plus-circle" class="text-blue-600 w-5 h-5"></i> Tambah Produk
                    </h2>
                    <div class="space-y-4">
                        <input id="add-name" type="text" class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm" placeholder="Nama Menu Baru">
                        <div class="grid grid-cols-2 gap-3">
                            <input id="add-price" type="number" class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm" placeholder="Harga (Rp)">
                            <select id="add-category" class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm bg-slate-50">
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Keripik">Keripik</option>
                            </select>
                        </div>
                        <button onclick="addProduct()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold transition">Tambah Ke Katalog</button>
                    </div>
                </div>

                <!-- EDIT PRODUK -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-slate-800">
                        <i data-lucide="edit" class="text-blue-600 w-5 h-5"></i> Edit / Hapus Menu
                    </h2>
                    <div class="space-y-4">
                        <select id="edit-select" onchange="loadProductData()" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 font-semibold text-sm"></select>
                        <input id="edit-name" type="text" class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm">
                        <div class="grid grid-cols-2 gap-3">
                            <input id="edit-price" type="number" class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm font-bold text-blue-600">
                            <select id="edit-category" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50">
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Keripik">Keripik</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="deleteProduct()" class="bg-red-50 text-red-600 p-3 rounded-xl hover:bg-red-100 transition">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                            <button onclick="updateProduct()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">Update Menu</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HISTORY & LAPORAN -->
            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-slate-800">
                            <i data-lucide="history" class="text-emerald-600 w-5 h-5"></i> Total Transaksi
                        </h2>
                        <div class="p-6 bg-emerald-50 rounded-2xl text-center mb-4">
                            <span id="today-count" class="text-4xl font-black text-emerald-800">0</span>
                            <p class="text-xs font-bold text-emerald-600 uppercase mt-1">Selesai</p>
                        </div>
                        <button onclick="downloadPDF()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                            <i data-lucide="file-text" class="w-5 h-5"></i> Download History
                        </button>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-slate-800">
                            <i data-lucide="bar-chart-3" class="text-orange-600 w-5 h-5"></i> Top Sales Item
                        </h2>
                        <div id="item-sales-list" class="space-y-2 mb-4 max-h-40 overflow-y-auto pr-1"></div>
                        <button onclick="downloadItemReportPDF()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                            <i data-lucide="download" class="w-5 h-5"></i> Laporan Item
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- BOTTOM BAR -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-4 pb-6 shadow-[0_-10px_25px_rgba(0,0,0,0.05)] z-40">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="relative bg-blue-600 p-3.5 rounded-2xl shadow-lg">
                    <i data-lucide="shopping-cart" class="w-6 h-6 text-white"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-slate-900 text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-4 border-white">0</span>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Total Bayar</p>
                    <p id="total-price" class="text-xl font-black text-slate-900">Rp 0</p>
                </div>
            </div>
            <button onclick="openCheckout()" class="flex-1 md:flex-none bg-blue-600 text-white px-12 py-4 rounded-2xl font-bold shadow-xl shadow-blue-200 text-lg transition-transform active:scale-95">
                BAYAR
            </button>
        </div>
    </div>

    <!-- MODAL PEMBAYARAN & SUKSES (Sama seperti sebelumnya namun disesuaikan fungsinya) -->
    <div id="modal-checkout" class="fixed inset-0 bg-slate-900/60 z-[60] flex items-end md:items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-t-[2.5rem] md:rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="font-bold text-xl">Detail Pesanan</h3>
                <button onclick="closeCheckout()" class="p-2 text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <div id="cart-items" class="max-h-[35vh] overflow-y-auto p-6 space-y-3"></div>
            <div class="p-8 bg-slate-50 space-y-6">
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setPayment('Cash')" id="btn-cash" class="pay-btn border-2 p-4 rounded-2xl text-[11px] font-bold bg-white">CASH</button>
                    <button onclick="setPayment('QRIS')" id="btn-qr" class="pay-btn border-2 p-4 rounded-2xl text-[11px] font-bold bg-white">QRIS</button>
                    <button onclick="setPayment('Shopee')" id="btn-sf" class="pay-btn border-2 p-4 rounded-2xl text-[11px] font-bold bg-white">SHOPEE</button>
                </div>
                <button onclick="processOrder()" id="confirm-pay" class="w-full bg-blue-600 text-white py-5 rounded-[1.5rem] font-bold disabled:bg-slate-300" disabled>KONFIRMASI</button>
            </div>
        </div>
    </div>

    <div id="modal-success" class="fixed inset-0 bg-slate-900/80 z-[70] flex items-center justify-center hidden p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle-2" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">Berhasil!</h2>
            <div class="mb-6 text-left">
                <label class="text-[11px] font-bold text-slate-400 uppercase ml-2">WhatsApp Struk (Opsional)</label>
                <input id="wa-number" type="number" class="w-full p-4 border border-slate-200 rounded-2xl outline-none mt-1 font-bold" placeholder="0812xxx">
            </div>
            <div class="space-y-3">
                <button onclick="sendWhatsApp()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                    <i data-lucide="message-circle" class="w-5 h-5"></i> WhatsApp
                </button>
                <button onclick="printReceipt()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                    <i data-lucide="printer" class="w-5 h-5"></i> Cetak PDF
                </button>
                <button onclick="finishTransaction()" class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold mt-4">Selesai & Reset</button>
            </div>
        </div>
    </div>

    <script>
        const STORE_NAME = "OKTSHOP17";
        const ADMIN_USER = "Admin123";
        const ADMIN_PASS = "Oktshop17";

        // DATA AWAL PRODUK
        let products = JSON.parse(localStorage.getItem('pos_products')) || [
            { id: 1, name: 'Boci Urat', price: 12000, category: 'Makanan' },
            { id: 12, name: 'Es Jasjus', price: 2000, category: 'Minuman' },
            { id: 101, name: 'Keripik Kaca', price: 5000, category: 'Keripik' },
        ];

        let cart = [];
        let selectedPayment = '';
        let lastOrder = null;
        let currentCategory = 'Makanan';
        let orderHistory = JSON.parse(localStorage.getItem('pos_history')) || [];
        let nextReceiptNum = parseInt(localStorage.getItem('pos_receipt_counter')) || 1;

        function init() {
            filterCategory('Makanan');
            updateCartUI();
            lucide.createIcons();
        }

        // --- KATEGORI & KATALOG ---
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-500');
            });
            const activeTab = document.getElementById(`tab-${cat}`);
            activeTab.classList.add('active', 'bg-blue-600', 'text-white');
            renderCatalog();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            const filtered = products.filter(p => p.category === currentCategory);
            grid.innerHTML = filtered.map(p => `
                <div onclick="addToCart(${p.id})" class="product-card bg-white p-5 rounded-[2rem] shadow-sm hover:border-blue-400 cursor-pointer border-2 border-transparent">
                    <h3 class="font-extrabold text-slate-800 text-sm mb-2 leading-tight">${p.name}</h3>
                    <p class="text-blue-600 font-black">Rp ${p.price.toLocaleString()}</p>
                </div>
            `).join('') || `<div class="col-span-full text-center py-10 text-slate-400 text-sm">Belum ada menu di kategori ini</div>`;
        }

        // --- ADMIN FUNCTIONS (TAMBAH, EDIT, HAPUS) ---
        function addProduct() {
            const name = document.getElementById('add-name').value;
            const price = parseInt(document.getElementById('add-price').value);
            const category = document.getElementById('add-category').value;

            if(!name || !price) return alert("Harap isi Nama dan Harga!");

            const newProduct = {
                id: Date.now(), // Unique ID
                name: name,
                price: price,
                category: category
            };

            products.push(newProduct);
            saveAndRefresh();
            
            // Reset Form
            document.getElementById('add-name').value = '';
            document.getElementById('add-price').value = '';
            alert("Produk berhasil ditambahkan!");
        }

        function loadProductData() {
            const id = parseInt(document.getElementById('edit-select').value);
            const product = products.find(p => p.id === id);
            if(product) {
                document.getElementById('edit-name').value = product.name;
                document.getElementById('edit-price').value = product.price;
                document.getElementById('edit-category').value = product.category;
            }
        }

        function updateProduct() {
            const id = parseInt(document.getElementById('edit-select').value);
            const idx = products.findIndex(p => p.id === id);
            if (idx !== -1) {
                products[idx].name = document.getElementById('edit-name').value;
                products[idx].price = parseInt(document.getElementById('edit-price').value);
                products[idx].category = document.getElementById('edit-category').value;
                saveAndRefresh();
                alert('Berhasil diperbarui!');
            }
        }

        function deleteProduct() {
            const id = parseInt(document.getElementById('edit-select').value);
            if(confirm("Hapus menu ini dari katalog?")) {
                products = products.filter(p => p.id !== id);
                saveAndRefresh();
                alert('Produk dihapus!');
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('pos_products', JSON.stringify(products));
            renderCatalog();
            renderAdminTools();
        }

        function renderAdminTools() {
            const select = document.getElementById('edit-select');
            select.innerHTML = products.map(p => `<option value="${p.id}">${p.name} [${p.category}]</option>`).join('');
            loadProductData();
            document.getElementById('today-count').innerText = orderHistory.length;
            
            // Top Item Sales
            const summary = {};
            orderHistory.forEach(o => o.items.forEach(i => {
                summary[i.name] = (summary[i.name] || 0) + i.qty;
            }));
            const sortedItems = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            document.getElementById('item-sales-list').innerHTML = sortedItems.map(([name, qty]) => `
                <div class="flex justify-between text-[11px] p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="font-bold">${name}</span>
                    <span class="bg-blue-600 text-white px-2 rounded font-bold">${qty}</span>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Belum ada penjualan</p>';
        }

        // --- TRANSAKSI FUNCTIONS ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
            renderCartItems();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString()}`;
        }

        function openCheckout() {
            if (cart.length === 0) return alert('Pilih produk dulu!');
            document.getElementById('modal-checkout').classList.remove('hidden');
            renderCartItems();
        }

        function closeCheckout() {
            document.getElementById('modal-checkout').classList.add('hidden');
            selectedPayment = '';
            updatePaymentButtons();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 text-sm">
                    <div>
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-blue-600 font-bold">Rp ${(item.price * item.qty).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-1 rounded-xl font-bold">
                        <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 text-slate-400">-</button>
                        <span>${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 text-slate-400">+</button>
                    </div>
                </div>
            `).join('');
        }

        function setPayment(method) {
            selectedPayment = method;
            updatePaymentButtons();
            document.getElementById('confirm-pay').disabled = false;
        }

        function updatePaymentButtons() {
            const btns = { 'Cash': 'btn-cash', 'QRIS': 'btn-qr', 'Shopee': 'btn-sf' };
            Object.values(btns).forEach(id => {
                document.getElementById(id).className = "pay-btn border-2 p-4 rounded-2xl text-[11px] font-bold bg-white border-slate-200";
            });
            if(btns[selectedPayment]) {
                document.getElementById(btns[selectedPayment]).className = "pay-btn border-2 p-4 rounded-2xl text-[11px] font-bold bg-blue-50 border-blue-600 text-blue-700";
            }
        }

        function processOrder() {
            const receiptID = nextReceiptNum.toString().padStart(5, '0');
            lastOrder = {
                id: receiptID,
                date: new Date().toLocaleString('id-ID'),
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                method: selectedPayment,
                items: JSON.parse(JSON.stringify(cart))
            };
            orderHistory.push(lastOrder);
            localStorage.setItem('pos_history', JSON.stringify(orderHistory));
            nextReceiptNum++;
            localStorage.setItem('pos_receipt_counter', nextReceiptNum);
            
            document.getElementById('modal-checkout').classList.add('hidden');
            document.getElementById('modal-success').classList.remove('hidden');
            lucide.createIcons();
        }

        function finishTransaction() {
            cart = [];
            lastOrder = null;
            updateCartUI();
            document.getElementById('modal-success').classList.add('hidden');
            filterCategory('Makanan');
        }

        // --- PRINT & LOGIN (Sama seperti sebelumnya) ---
        function openLoginModal() { document.getElementById('modal-login').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('modal-login').classList.add('hidden'); }
        function checkLogin() {
            if(document.getElementById('login-user').value === ADMIN_USER && document.getElementById('login-pass').value === ADMIN_PASS) {
                closeLoginModal(); showPage('admin');
            } else { alert("Akses Ditolak!"); }
        }
        function showPage(page) {
            document.getElementById('page-home').classList.toggle('hidden', page !== 'home');
            document.getElementById('bottom-bar').classList.toggle('hidden', page !== 'home');
            document.getElementById('page-admin').classList.toggle('hidden', page !== 'admin');
            if(page === 'admin') renderAdminTools();
            lucide.createIcons();
        }

        function sendWhatsApp() {
            if(!lastOrder) return;
            let phone = document.getElementById('wa-number').value.replace(/[^0-9]/g, "");
            if (phone.startsWith("0")) phone = "62" + phone.slice(1);
            let text = `*STRUK ${STORE_NAME}*%0A------------------%0A`;
            lastOrder.items.forEach(i => text += `${i.name} x${i.qty} = ${i.price * i.qty}%0A`);
            text += `------------------%0A*TOTAL: Rp ${lastOrder.total}*`;
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        function printReceipt() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: [80, 150] });
            doc.text(STORE_NAME, 40, 10, { align: "center" });
            doc.setFontSize(8).text(`No: ${lastOrder.id}`, 5, 20);
            let y = 30;
            lastOrder.items.forEach(i => {
                doc.text(`${i.name} x${i.qty}`, 5, y);
                doc.text(`${i.price * i.qty}`, 75, y, { align: "right" });
                y += 7;
            });
            doc.text(`TOTAL: ${lastOrder.total}`, 75, y+5, { align: "right" });
            doc.save(`Struk-${lastOrder.id}.pdf`);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("History Transaksi OKTSHOP17", 10, 10);
            const data = orderHistory.map(o => [o.id, o.date, o.method, o.total]);
            doc.autoTable({ head: [['No', 'Tgl', 'Metode', 'Total']], body: data });
            doc.save("History-Penjualan.pdf");
        }

        function downloadItemReportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const summary = {};
            orderHistory.forEach(o => o.items.forEach(i => {
                if(!summary[i.name]) summary[i.name] = { qty: 0, rev: 0 };
                summary[i.name].qty += i.qty;
                summary[i.name].rev += (i.qty * i.price);
            }));
            const data = Object.entries(summary).map(([name, val]) => [name, val.qty, val.rev]);
            doc.autoTable({ head: [['Produk', 'Terjual', 'Pendapatan']], body: data });
            doc.save("Laporan-Item.pdf");
        }

        init();
    </script>
</body>
</html>
