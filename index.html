<!-- Tampilan Khusus Admin -->
<div id="profile-admin" class="hidden admin-layout">
    <!-- Sidebar / Panel Kiri -->
    <aside class="admin-sidebar">
        <div class="admin-header-title">
            <h2>Admin Panel</h2>
        </div>

        <div class="admin-card">
            <h3>Tambah Menu Baru</h3>
            <div class="admin-form">
                <input id="pName" type="text" placeholder="Nama Menu">
                <input id="pPrice" type="number" placeholder="Harga (Rp)">
                <input id="pStock" type="number" placeholder="Stok">
                
                <div class="file-input-wrapper">
                    <label for="pImage">Pilih Foto Produk</label>
                    <input id="pImage" type="file" accept="image/*">
                </div>

                <button id="btnSaveProduct" class="btn-success-full">SIMPAN MENU</button>
            </div>
        </div>

        <div class="admin-section">
            <h4>Daftar Katalog (Max 20)</h4>
            <div id="admin-prod-list" class="mini-list">
                <!-- List Produk Muncul di Sini -->
                <p class="empty-text">Menu Kosong</p>
            </div>
        </div>

        <button onclick="exportReport()" class="btn-orange">
            <i class="fas fa-file-alt"></i> CETAK LAPORAN 30 HARI
        </button>

        <div class="admin-card mt-20">
            <h4>Update QRIS:</h4>
            <div class="file-input-wrapper">
                <input id="qrisInput" type="file" accept="image/*">
            </div>
        </div>

        <p onclick="clearHistory()" class="text-danger-link">Hapus Semua Riwayat</p>
    </aside>

    <!-- Konten Kanan (Orderan) -->
    <main class="admin-main-content">
        <div class="tabs admin-tabs">
            <div class="tab active" onclick="switchAdminTab('adm-order')">Order Masuk</div>
            <div class="tab" onclick="switchAdminTab('adm-redeem')">Tukar Poin</div>
        </div>
        
        <div id="adm-order" class="adm-content">
            <div id="admin-order-list"></div>
        </div>
        <div id="adm-redeem" class="adm-content hidden">
            <div id="admin-redeem-list"></div>
        </div>
    </main>
</div>
