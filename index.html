<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS KASIR - OKTSHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="flex items-center justify-between max-w-6xl mx-auto">
            <button onclick="showPage('admin')" class="text-blue-600 font-semibold flex items-center gap-1 hover:bg-blue-50 p-2 rounded-lg transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="hidden md:inline">Admin Panel</span>
            </button>
            <h1 class="text-xl font-bold text-gray-800 text-center flex-1">
                POS KASIR <span class="text-blue-600 text-sm block md:inline md:ml-1">by OKTSHOP</span>
            </h1>
            <div class="w-20 md:w-24"></div>
        </div>
    </header>

    <!-- MAIN CONTENT (KATALOG) -->
    <main id="page-home" class="max-w-6xl mx-auto p-4">
        <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Render via JS -->
        </div>
    </main>

    <!-- ADMIN PANEL PAGE -->
    <main id="page-admin" class="max-w-4xl mx-auto p-4 hidden">
        <button onclick="showPage('home')" class="mb-6 text-gray-600 flex items-center gap-1 hover:text-blue-600">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Beranda
        </button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Update Katalog Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="text-blue-600"></i> Update Katalog
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Pilih Produk</label>
                        <select id="edit-select" onchange="loadProductData()" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"></select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Nama Produk</label>
                        <input id="edit-name" type="text" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Harga (Rp)</label>
                        <input id="edit-price" type="number" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Ganti Gambar</label>
                        <input id="edit-image" type="file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mt-1">
                    </div>
                    <button onclick="updateProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-blue-200">
                        Simpan Perubahan
                    </button>
                </div>
            </div>

            <!-- Laporan & Ringkasan -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="text-green-600"></i> Ringkasan Penjualan
                    </h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="p-4 bg-green-50 rounded-xl">
                            <p class="text-sm text-green-700 font-medium">Transaksi Hari Ini</p>
                            <p id="today-count" class="text-3xl font-bold text-green-800">0</p>
                        </div>
                        <button onclick="downloadPDF()" class="w-full border-2 border-blue-600 text-blue-600 hover:bg-blue-50 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                            <i data-lucide="download" class="w-5 h-5"></i> Download PDF (30 Hari)
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Riwayat Tabel -->
        <div class="mt-6 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4">Riwayat 5 Transaksi Terakhir</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-400 text-sm border-b">
                            <th class="py-3 font-semibold">Waktu</th>
                            <th class="py-3 font-semibold">Metode</th>
                            <th class="py-3 font-semibold text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="order-history-list" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- BOTTOM BAR -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-40">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="relative bg-blue-50 p-3 rounded-xl">
                    <i data-lucide="shopping-basket" class="w-7 h-7 text-blue-600"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Total Tagihan</p>
                    <p id="total-price" class="text-xl font-black text-gray-800">Rp 0</p>
                </div>
            </div>
            <button onclick="openCheckout()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3.5 rounded-2xl font-bold transition-all transform active:scale-95 shadow-lg shadow-blue-200">
                BAYAR SEKARANG
            </button>
        </div>
    </div>

    <!-- MODAL CHECKOUT -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/60 z-[60] flex items-end md:items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-5 border-b flex justify-between items-center">
                <h3 class="font-bold text-xl text-gray-800">Konfirmasi Pesanan</h3>
                <button onclick="closeCheckout()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="x"></i></button>
            </div>
            
            <div id="cart-items" class="max-h-[40vh] overflow-y-auto p-5 space-y-3"></div>

            <div class="p-6 bg-gray-50 space-y-4">
                <p class="font-bold text-sm text-gray-600 uppercase tracking-widest text-center">Metode Pembayaran</p>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setPayment('Cash')" class="pay-btn border-2 bg-white p-3 rounded-xl text-xs font-bold text-center transition hover:border-blue-500" id="btn-cash">CASH</button>
                    <button onclick="setPayment('QR/Transfer')" class="pay-btn border-2 bg-white p-3 rounded-xl text-xs font-bold text-center transition hover:border-blue-500" id="btn-qr">QRIS</button>
                    <button onclick="setPayment('ShopeeFood')" class="pay-btn border-2 bg-white p-3 rounded-xl text-xs font-bold text-center transition hover:border-blue-500" id="btn-shopee">SHOPEE</button>
                </div>
                <button onclick="processOrder()" id="confirm-pay" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold mt-2 disabled:bg-gray-300 disabled:cursor-not-allowed transition shadow-lg shadow-green-100" disabled>
                    PROSES PEMBAYARAN
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- INITIAL DATA ---
        const placeholderImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80";
        
        let products = JSON.parse(localStorage.getItem('pos_products')) || [
            { id: 1, name: 'Es Kopi Susu', price: 15000, img: placeholderImg },
            { id: 2, name: 'Americano', price: 12000, img: placeholderImg },
            { id: 3, name: 'Caramel Latte', price: 18000, img: placeholderImg },
            { id: 4, name: 'Croissant', price: 20000, img: placeholderImg },
            { id: 5, name: 'French Fries', price: 12000, img: placeholderImg },
            { id: 6, name: 'Fried Rice OKT', price: 25000, img: placeholderImg },
            { id: 7, name: 'Iced Tea', price: 5000, img: placeholderImg },
            { id: 8, name: 'Matcha Latte', price: 18000, img: placeholderImg },
            { id: 9, name: 'Toast Bread', price: 15000, img: placeholderImg },
            { id: 10, name: 'Beef Burger', price: 22000, img: placeholderImg },
            { id: 11, name: 'Ayam Geprek', price: 18000, img: placeholderImg },
            { id: 12, name: 'Dimsum Pack', price: 15000, img: placeholderImg },
        ];

        let cart = [];
        let selectedPayment = '';
        let orderHistory = JSON.parse(localStorage.getItem('pos_history')) || [];

        function init() {
            renderCatalog();
            updateCartUI();
            lucide.createIcons();
        }

        function showPage(page) {
            document.getElementById('page-home').classList.toggle('hidden', page !== 'home');
            document.getElementById('bottom-bar').classList.toggle('hidden', page !== 'home');
            document.getElementById('page-admin').classList.toggle('hidden', page !== 'admin');
            if(page === 'admin') {
                renderAdminTools();
                loadProductData();
            }
            lucide.createIcons();
        }

        // --- CATALOG LOGIC ---
        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white p-3 rounded-3xl shadow-sm border border-gray-100 hover:border-blue-400 transition-all cursor-pointer active:scale-95 group">
                    <img src="${p.img}" class="product-img mb-3 group-hover:opacity-90 transition" alt="${p.name}">
                    <h3 class="font-bold text-gray-800 text-sm truncate px-1">${p.name}</h3>
                    <p class="text-blue-600 font-black px-1">Rp ${p.price.toLocaleString()}</p>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
            renderCartItems();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString()}`;
        }

        function openCheckout() {
            if (cart.length === 0) return alert('Pilih menu dulu kak!');
            document.getElementById('modal-checkout').classList.remove('hidden');
            renderCartItems();
            lucide.createIcons();
        }

        function closeCheckout() {
            document.getElementById('modal-checkout').classList.add('hidden');
            selectedPayment = '';
            updatePaymentButtons();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">${item.name}</p>
                        <p class="text-xs text-blue-600 font-bold">Rp ${(item.price * item.qty).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-white p-1 rounded-xl border">
                        <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 rounded-lg font-bold">-</button>
                        <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
                        <button onclick="addToCart(${item.id}); renderCartItems();" class="w-8 h-8 flex items-center justify-center text-blue-600 hover:bg-blue-50 rounded-lg font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function setPayment(method) {
            selectedPayment = method;
            updatePaymentButtons();
            document.getElementById('confirm-pay').disabled = false;
        }

        function updatePaymentButtons() {
            ['btn-cash', 'btn-qr', 'btn-shopee'].forEach(id => {
                document.getElementById(id).classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
            });
            if(selectedPayment === 'Cash') document.getElementById('btn-cash').classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            if(selectedPayment === 'QR/Transfer') document.getElementById('btn-qr').classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            if(selectedPayment === 'ShopeeFood') document.getElementById('btn-shopee').classList.add('bg-blue-600', 'text-white', 'border-blue-600');
        }

        function processOrder() {
            const order = {
                id: Date.now(),
                date: new Date().toISOString(),
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                method: selectedPayment
            };
            orderHistory.push(order);
            localStorage.setItem('pos_history', JSON.stringify(orderHistory));
            alert('Pembayaran Berhasil! Pesanan diproses.');
            cart = [];
            closeCheckout();
            updateCartUI();
        }

        // --- ADMIN LOGIC ---
        function renderAdminTools() {
            const select = document.getElementById('edit-select');
            select.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            
            const today = new Date().toLocaleDateString();
            const todayOrders = orderHistory.filter(o => new Date(o.date).toLocaleDateString() === today);
            document.getElementById('today-count').innerText = todayOrders.length;

            const historyList = document.getElementById('order-history-list');
            historyList.innerHTML = orderHistory.slice(-5).reverse().map(o => `
                <tr class="text-sm">
                    <td class="py-4 text-gray-500">${new Date(o.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                    <td class="py-4 font-medium">${o.method}</td>
                    <td class="py-4 text-right font-bold text-blue-600">Rp ${o.total.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function loadProductData() {
            const id = parseInt(document.getElementById('edit-select').value);
            const product = products.find(p => p.id === id);
            document.getElementById('edit-name').value = product.name;
            document.getElementById('edit-price').value = product.price;
        }

        async function updateProduct() {
            const id = parseInt(document.getElementById('edit-select').value);
            const newName = document.getElementById('edit-name').value;
            const newPrice = parseInt(document.getElementById('edit-price').value);
            const imageFile = document.getElementById('edit-image').files[0];

            const index = products.findIndex(p => p.id === id);
            if (newName) products[index].name = newName;
            if (newPrice) products[index].price = newPrice;

            if (imageFile) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    products[index].img = reader.result;
                    saveAndRefresh();
                }
                reader.readAsDataURL(imageFile);
            } else {
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('pos_products', JSON.stringify(products));
            alert('Katalog Berhasil Diperbarui!');
            document.getElementById('edit-image').value = "";
            renderCatalog();
            renderAdminTools();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("LAPORAN PENJUALAN - OKTSHOP", 14, 20);
            doc.setFontSize(10);
            doc.text(`Dicetak pada: ${new Date().toLocaleString()}`, 14, 28);
            
            const tableData = orderHistory.map(o => [
                new Date(o.date).toLocaleDateString('id-ID'),
                o.method,
                `Rp ${o.total.toLocaleString()}`
            ]);

            doc.autoTable({
                head: [['Tanggal', 'Metode', 'Total']],
                body: tableData,
                startY: 35,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] }
            });

            doc.save("rekap-oktshop.pdf");
        }

        init();
    </script>
</body>
</html>
